# Provision / update Azure infrastructure from infra/main.bicep. Manual trigger only.
name: infra

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Resource group to deploy into (created if missing)
        required: true
        default: rg-invoice-bridge
      location:
        description: Azure region
        required: true
        default: australiaeast

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group
        run: az group create --name "${{ inputs.resourceGroup }}" --location "${{ inputs.location }}" --output none

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resourceGroup }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters \
                namePrefix="${{ vars.AZURE_NAME_PREFIX }}" \
                postgresAdminPassword="${{ secrets.POSTGRES_ADMIN_PASSWORD }}" \
                xeroClientId="${{ secrets.XERO_CLIENT_ID }}" \
                xeroClientSecret="${{ secrets.XERO_CLIENT_SECRET }}" \
                tokenEncryptionKey="${{ secrets.TOKEN_ENCRYPTION_KEY }}" \
            --query properties.outputs
